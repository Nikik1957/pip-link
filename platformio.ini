; Pip-Boy Companion Hub — ESP32-S3 (Seeed XIAO ESP32-S3)
; Core is Arduino-ESP32 2.0.17 / ESP-IDF 4.4 (PlatformIO pkg 3.20017).
;
; Targets that use USB *host* (talk to the Pip-Boy) give up the XIAO's USB console:
; Serial goes to UART0 (D6/D7), and logs also land on the Pip-Boy SD card
; (HOLO/TERM/ESP.LOG; read with `python tools/term_sim.py inspect`).
; Re-flash those: plug the XIAO into the PC, hold BOOT, tap RESET, release BOOT, upload.

[env]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200

; keep the build machine's user folder out of the firmware (__FILE__ paths in asserts) - see the script
extra_scripts = pre:tools/strip_paths.py

[usbhost]
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D ARDUINO_USB_MODE=1

; M4: the real thing — MeshCore over BLE, displayed on the Pip-Boy terminal over USB host.
[env:hub]
build_src_filter = -<*> +<hub_main.cpp>
build_flags = ${usbhost.build_flags}
lib_deps =
    h2zero/NimBLE-Arduino@^2.0.0
    ewpa/LibSSH-ESP32@5.9.0          ; TERM tab SSH (LGPL-2.1, libssh port)

; M3: PipLink + PipTerm demo (menu, keyboard, scroll, stats) on the Pip-Boy terminal.
[env:term_demo]
build_src_filter = -<*> +<term_demo.cpp>
build_flags = ${usbhost.build_flags}
lib_ignore = NimBLE-Arduino

; M2: minimal USB-host round-trip spike (kept for reference).
[env:usbhost_spike]
build_src_filter = -<*> +<spike_usbhost.cpp>
build_flags = ${usbhost.build_flags}
lib_ignore = NimBLE-Arduino, pipterm

; Original BLE companion probe (contacts + messages printed to the USB console, COM7).
[env:ble_probe]
build_src_filter = -<*> +<ble_probe.cpp>
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
lib_deps = h2zero/NimBLE-Arduino@^2.0.0
lib_ignore = usb_host_cdc_acm, pipterm

; SSH spike: does LibSSH-ESP32 build on this core (kept for reference).
[env:ssh_spike]
build_src_filter = -<*> +<ssh_spike.cpp>
build_flags = ${usbhost.build_flags}
lib_deps = ewpa/LibSSH-ESP32@5.9.0
lib_ignore = NimBLE-Arduino, pipterm, usb_host_cdc_acm, ble_hub, ble_keyboard, ble_radiacode, meshcore_ble, meshtastic_ble, mesh_radio, remote_term
